[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakicode"
version = "0.1.0"
description = "A minimal AI coding-agent CLI (learning project)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "openai",
    "prompt-toolkit>=3.0.52",
    "python-dotenv",
    "rich",
    "tiktoken>=0.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sakicode = "sakicode.cli:main"
sakicode-eval = "sakicode.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# evals/tasks/*/workspace/ contains intentionally broken fixtures; only the
# harness's own suite under tests/ should be collected.
testpaths = ["tests"]

[tool.setuptools.package-data]
sakicode = ["builtin_skills/*/*"]
